name: label-fix
on:
  push:
    paths: ['.github/workflows/label-fix.yml']
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: edit
        run: |
          python3 - <<'PY'
          h=open('index.html').read()
          a='Acquire this work'
          assert h.count(a)==2
          h=h.replace(a,'Purchase')
          open('index.html','w').write(h)
          PY
          git config user.name label-bot
          git config user.email label-bot@users.noreply.github.com
          git add -A
          git commit -m 'Primary action label: Purchase'
          git push
