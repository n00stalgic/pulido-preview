name: Apply portfolio entry points once
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: portfolio-entry-once
  cancel-in-progress: false
jobs:
  apply-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply only the reviewed gallery patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check portfolio-entry.patch
          git apply portfolio-entry.patch
          test "$(git diff --name-only)" = "index.html"
          git diff --stat
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add portfolio-native placement entry points"
          git push origin HEAD:main
