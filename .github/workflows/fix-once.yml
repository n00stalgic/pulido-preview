name: fix-once
on:
  push:
    paths: ['.github/workflows/fix-once.yml']
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: edit
        run: |
          python3 - <<'PY'
          import re
          h=open('index.html').read()
          h,c1=re.subn(r'<link rel="preload" as="image"[^>]*>','',h,count=1)
          assert c1==1
          def sub(a,b):
              global h
              assert h.count(a)==1,(a,h.count(a))
              h=h.replace(a,b)
          sub("const d=dx<0?1:-1,n=i+d,end=n<0||n>=list.length;","const d=dx<0?1:-1,n=(i+d+list.length)%list.length,end=false;")
          sub("chips();render();setTimeout(()=>document.body.classList.remove('boot'),700);","if(!location.hash.startsWith('#portfolio-'))i=Math.floor(Math.random()*list.length);chips();render();setTimeout(()=>document.body.classList.remove('boot'),700);")
          css='''<style id="fix1">@media(min-width:900px){#room{grid-template-columns:minmax(0,calc(100vh - 150px)) 440px;justify-content:center;column-gap:64px}#info{align-self:center;padding-bottom:0}}#portfolio-place{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:0 16px;min-height:36px;border:1px solid color-mix(in srgb,var(--ink) 40%,transparent);border-radius:999px;background:none;color:var(--ink);font:inherit;font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.85;cursor:pointer;transition:background .15s,opacity .15s}#portfolio-place:hover{background:color-mix(in srgb,var(--ink) 14%,transparent);opacity:1}</style>'''
          assert h.count('</head>')==1
          h=h.replace('</head>',css+'</head>',1)
          open('index.html','w').write(h)
          PY
          grep -c 'fix1' index.html
          git config user.name fix-bot
          git config user.email fix-bot@users.noreply.github.com
          git add -A
          git commit -m 'Fix wide-screen gap, CTA style, rotating landing, looping swipe'
          git push
