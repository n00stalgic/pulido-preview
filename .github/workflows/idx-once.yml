name: idx-once
on:
  push:
    paths: ['.github/workflows/idx-once.yml']
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: edit
        run: |
          python3 - <<'PY'
          h=open('index.html').read()
          t='<meta name="robots" content="noindex,nofollow">'
          assert h.count(t)==1
          h=h.replace(t,'<meta name="robots" content="index,follow">')
          open('index.html','w').write(h)
          PY
          grep -c 'noindex' index.html || true
          git config user.name idx-bot
          git config user.email idx-bot@users.noreply.github.com
          git add -A
          git commit -m 'Allow search indexing'
          git push
