name: og-once
on:
  push:
    paths: ['.github/workflows/og-once.yml']
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          pip install pillow
          python3 - <<'PY'

          import re,urllib.request
          from PIL import Image,ImageDraw,ImageFont
          urllib.request.urlretrieve('https://github.com/google/fonts/raw/main/ofl/spacegrotesk/SpaceGrotesk%5Bwght%5D.ttf','sg.ttf')
          W,H=1200,630;BLUE=(10,110,166);CREAM=(250,248,244);SOFT=(205,226,240)
          def font(sz,w=700):
              f=ImageFont.truetype('sg.ttf',sz);f.set_variation_by_axes([w]);return f
          def art(n,box):
              im=Image.open('img/%s-1600.webp'%n).convert('RGB');w,h=box;r=max(w/im.width,h/im.height)
              im=im.resize((int(im.width*r)+1,int(im.height*r)+1),Image.LANCZOS);x=(im.width-w)//2;y=(im.height-h)//2
              return im.crop((x,y,x+w,y+h))
          def spaced(d,xy,t,f,fill,sp):
              x,y=xy
              for c in t:
                  d.text((x,y),c,font=f,fill=fill);x+=d.textlength(c,font=f)+sp
          def width(d,t,f,sp): return sum(d.textlength(c,font=f)+sp for c in t)-sp
          c=Image.new('RGB',(W,H),BLUE);d=ImageDraw.Draw(c);M=56
          spaced(d,(M,34),'PULIDO',font(22,700),CREAM,5)
          t='SF STUDIO PORTFOLIO  \u00b7  2026';f=font(15,500);w=width(d,t,f,3)
          spaced(d,(W-M-w,40),t,f,SOFT,3)
          d.line((M,76,W-M,76),fill=(120,170,205),width=1)
          spaced(d,(M-4,100),'PULIDO',font(120,700),CREAM,12)
          spaced(d,(M,246),'COLOR ROOMS',font(24,500),SOFT,7)
          names=['2026-01','2025-01','2026-04','2025-06','2026-07'];gap=8;tw=(W-2*M-gap*4)//5;y0=300;h=H-y0-M+20
          for i,n in enumerate(names): c.paste(art(n,(tw,h)),(M+i*(tw+gap),y0))
          c.save('og.jpg',quality=86,optimize=True,progressive=True)
          h=open('index.html').read()
          h,k=re.subn(r'<meta property="og:[^>]*>|<meta name="twitter:[^>]*>','',h)
          print('removed',k)
          tags=('<meta property="og:type" content="website">'
          '<meta property="og:site_name" content="Chas Pulido">'
          '<meta property="og:title" content="Chas Pulido - Color Rooms">'
          '<meta property="og:description" content="A room-by-room walk through the paintings of Chas Pulido.">'
          '<meta property="og:url" content="https://pulido.art/">'
          '<meta property="og:image" content="https://pulido.art/og.jpg">'
          '<meta property="og:image:secure_url" content="https://pulido.art/og.jpg">'
          '<meta property="og:image:type" content="image/jpeg">'
          '<meta property="og:image:width" content="1200">'
          '<meta property="og:image:height" content="630">'
          '<meta property="og:image:alt" content="Chas Pulido, Color Rooms: five abstract acrylic paintings on a blue ground">'
          '<meta name="twitter:card" content="summary_large_image">'
          '<meta name="twitter:title" content="Chas Pulido - Color Rooms">'
          '<meta name="twitter:description" content="A room-by-room walk through the paintings of Chas Pulido.">'
          '<meta name="twitter:image" content="https://pulido.art/og.jpg">'
          '<meta name="twitter:image:alt" content="Chas Pulido, Color Rooms: five abstract acrylic paintings on a blue ground">')
          assert h.count('<meta charset="utf-8">')==1
          h=h.replace('<meta charset="utf-8">','<meta charset="utf-8">'+tags)
          open('index.html','w').write(h);print(len(h))
          PY
          ls -la og.jpg
          git config user.name og-bot
          git config user.email og-bot@users.noreply.github.com
          git add -A
          git commit -m 'Add social share image and full Open Graph tags'
          git push
