name: perf-once2
on:
  push:
    paths: ['.github/workflows/perf-once2.yml']
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - name: build
        run: |
          python3 - <<'PY'
          import re,glob,os
          from PIL import Image
          Image.MAX_IMAGE_PIXELS=None
          h=open('index.html').read()
          for f in sorted(glob.glob('img/*-2400.webp')):
              i=os.path.basename(f)[:-10]
              im=Image.open(f);im.load();w,hh=im.size;s=1000/max(w,hh)
              im.convert('RGB').resize((round(w*s),round(hh*s)),Image.LANCZOS).save(f'img/{i}-1000.webp','WEBP',quality=76,method=4)
              a=f'img/{i}-1600.webp 1600w, img/{i}-2400.webp 2400w'
              assert a in h,a
              h=h.replace(a,f'img/{i}-1000.webp 1000w, '+a)
          def sub(a,b,c=1):
              global h;assert h.count(a)==c,(a,h.count(a));h=h.replace(a,b)
          SZ="(min-width:900px) calc(100vw - 600px), 100vw"
          sub("el.sizes='100vw'","el.sizes='"+SZ+"'")
          sub("p.sizes='100vw'","p.sizes='"+SZ+"'")
          sub("{tok++;$('ph').style.opacity=0;front.alt=r.title;setSrc(front,r);front.classList.add('on');return}",
           "{tok++;const ph=$('ph');ph.style.backgroundImage=r.ph?'url('+r.ph+')':'none';ph.style.opacity=1;front.alt=r.title;front.fetchPriority='high';setSrc(front,r);front.classList.add('on');const fo=()=>{ph.style.opacity=0};if(front.complete&&front.naturalWidth)fo();else{front.addEventListener('load',fo,{once:true});front.addEventListener('error',fo,{once:true});setTimeout(fo,6000)}return}")
          sub("$('pcov').src='img/press-cover.webp'","$('pcov').loading='lazy';$('pcov').src='img/press-cover.webp'")
          sub('<img class="pt" src="img/chas-pulido.webp" width="800" height="1000" alt="Chas Pulido in the gallery" decoding="async">','<img class="pt" src="img/chas-pulido.webp" width="800" height="1000" alt="Chas Pulido in the gallery" decoding="async" loading="lazy">')
          m=re.search(r'"(img/2026-01-1000\.webp 1000w, img/2026-01-1600\.webp 1600w, img/2026-01-2400\.webp 2400w)"',h);assert m
          sub('<meta charset="utf-8">','<meta charset="utf-8"><link rel="preload" as="image" fetchpriority="high" imagesrcset="'+m.group(1)+'" imagesizes="'+SZ+'">')
          open('index.html','w').write(h)
          print(len(h))
          PY
          git config user.name perf-bot
          git config user.email perf-bot@users.noreply.github.com
          git add -A
          git commit -m 'Faster first paint: 1000px tier, preload, early placeholder'
          git push
