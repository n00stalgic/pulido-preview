name: perf-fix
on:
  push:
    paths: ['.github/workflows/perf-fix.yml']
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: edit
        run: |
          python3 - <<'PY'
          h=open('index.html').read()
          def sub(a,b,n=1):
              global h
              assert h.count(a)==n,(a,h.count(a))
              h=h.replace(a,b)
          sub("(min-width:900px) calc(100vw - 600px), 100vw","(min-width:900px) min(calc(100vw - 600px), calc(100vh - 150px)), 100vw",2)
          sub("front.fetchPriority='high';setSrc(front,r);","front.fetchPriority='high';let up=0;setSrc(front,r.ss?Object.assign({},r,{ss:r.ss.split(', ')[0]}):r);")
          sub("const fo=()=>{ph.style.opacity=0;setTimeout(()=>warm(i),150)}","const fo=()=>{ph.style.opacity=0;if(r.ss&&!up){up=1;setSrc(front,r)}setTimeout(()=>warm(i),150)}")
          open('index.html','w').write(h)
          PY
          git config user.name perf-bot
          git config user.email perf-bot@users.noreply.github.com
          git add -A
          git commit -m 'Responsive image sizes for height-bound painting, lighter first paint'
          git push
