name: perf-once3
on:
  push:
    paths: ['.github/workflows/perf-once3.yml']
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          python3 - <<'PY'
          h=open('index.html').read()
          def sub(a,b):
              global h;assert h.count(a)==1,(a,h.count(a));h=h.replace(a,b)
          SZ="(min-width:900px) calc(100vw - 600px), 100vw"
          old="clearTimeout(pre);pre=setTimeout(()=>{if(t!==tok)return;const n=list[(i+1)%list.length];const p=new Image();if(n.ss){p.sizes='"+SZ+"';p.srcset=n.ss}p.src=n.src},700)}"
          new="clearTimeout(pre);pre=setTimeout(()=>{if(t!==tok)return;warm(i)},300)}"
          sub(old,new)
          fn=("const keep=[];let wq=0,hvt=0;"
          "function warmOne(n,lo){const p=new Image();if(lo)p.fetchPriority='low';p.decoding='async';if(n.ss){p.sizes='"+SZ+"';p.srcset=n.ss}p.src=n.src;keep.push(p);if(keep.length>14)keep.shift();return p}"
          "function warm(c){const L=list.length,ids=[(c+1)%L,(c-1+L)%L,(c+2)%L,(c-2+L)%L],w=++wq;(function nx(k){if(k>=ids.length||w!==wq)return;const p=warmOne(list[ids[k]],1);const f=()=>{p.decode?p.decode().then(()=>nx(k+1),()=>nx(k+1)):nx(k+1)};p.onload=f;p.onerror=()=>nx(k+1)})(0)} ")
          sub("function showImg(r){",fn+"function showImg(r){")
          sub("b.onclick=()=>pick(j,b);g.appendChild(b)","b.onclick=()=>pick(j,b);b.onpointerenter=()=>{clearTimeout(hvt);hvt=setTimeout(()=>warmOne(q),250)};b.onpointerleave=()=>clearTimeout(hvt);b.onpointerdown=()=>warmOne(q);g.appendChild(b)")
          sub("const fo=()=>{ph.style.opacity=0};","const fo=()=>{ph.style.opacity=0;setTimeout(()=>warm(i),150)};")
          open('index.html','w').write(h);print(len(h))
          PY
          git config user.name perf-bot
          git config user.email perf-bot@users.noreply.github.com
          git add -A
          git commit -m 'Prefetch neighbouring rooms for instant arrow navigation'
          git push
