name: Apply approved bio once
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply only approved About bio and remove this workflow
        run: |
          python3 - <<'PY'
          import pathlib,hashlib
          assert hashlib.sha256(pathlib.Path('index.html').read_bytes()).hexdigest() == '98c73c397fae189a1a8125f594ccd2dee73b4fa90057026c1f53eb33eb63cc8f', 'Index changed; stopped before patch'
          #!/usr/bin/env python3
          # Usage: apply_bio.py index.html  (edits in place). Replaces the About bio paragraphs and contact line only.
          import sys,html,re
          p='index.html'; s=open(p,encoding='utf-8').read()
          a=s.index('<h2>About Chas Pulido</h2>'); img_end=s.index('>',s.index('<img class="pt"',a))+1
          end_marker='<a href="https://www.youtube.com/@ChasPulido"'
          b=s.index('</p></div></div>\n<div id="press"',img_end)+len('</p>')
          LINK=' style="color:inherit"'
          ps=[]
          for line in ['[[Chas Pulido]] is a self taught abstract acrylic action painter located in San Francisco, California with his studio based in the fast growing Dogpatch neighborhood.', 'Taking things back to the early days, Chas exhibited passion and vocation for visual arts from a young age.\xa0Even in his early paintings, Chas’ work displayed unique boldness, color, and motion — showcasing a true artist’s voice & earning him recognition with an International Mobius Award, often referred to as the Oscars of design.', 'Chas’ present practice delves into the world of action art popularized by the famed Jackson Pollock whose signature style utilized a “drip like technique” of pouring and splashing paint onto a canvas. Aided by tools in the form of normally found household items — such as paper towels, dustpans, mops, and spatulas — as well as specialized brushes called Egbert’s, Chas developed his own unique style of motion based art. His method involves throwing splattered paint\xa0\xa0with the help of his various tools, often with the full force of his whole body, to create his signature patterns and high volume textures.', 'Like every great startup story, Chas began inventing & practicing his style in a small family garage where he would hone his technique on tiny 6 inch canvases scaling things gradually to where nowadays he paints on extra large custom surfaces, spanning 4 to 8 feet, across a variety of sizes & shapes, in a state of the art 3,000 square foot warehouse studio custom built for his action art style — truly a creator’s heaven & a one of a kind slice of paradise encompassing nearly 500 distinct colors of paint (across 6 different textures/densities), countless tools/custom devices, gallery display, office space, and even complete with a second story viewing deck.', 'Chas’ paintings often represent vibrant energetic visuals, with his practice divided amongst his more structured designs depicting abstract impressionistic versions of nature — such as flowers, waves, trees, grape vines, reefs, plants, and his ever popular hearts to name a few — to his less structured fully abstract patterns of motion taking the form of flares, explosions, spectrums, fireworks, ribbons, storms, geysers, stars, frenzies, auroras, fire, meteor showers, rainbows, and really just about any take on what can be characterized as movement. He’s always learning, developing techniques, building tools, finding new colors, and creating custom canvas shapes. His commitment to exploring and evolving his art through bold experimentation highlights his drive for innovation.', 'His art is also shaped by the diverse tapestry that is his many life experiences — traveling to nearly 90 countries across all 7 continents, over 300 scuba dives, 500 plus concerts, as well as other experiences both near and far, all provide a well founded source for his creativity through his exposure to new cuisines, various architectures, cultural traditions, nature’s forms across a multitude of climates, regions, as well as depths, world renowned museums/galleries, and the many practices of local artists spanning all different styles across mediums.', 'In addition to his passion for art, Chas balances his time as an early stage Venture Capitalist where he invests in cutting edge Life Science startups developing life changing medicines, driving transformational results in care standards, by creating desperately needed new options for patients in need. For his work, he has been honored as a member of Forbes 30 under 30 & Business Insider’s Rising Star VC.', 'Despite his ambition & recognitions, Chas’ journey has not been linear & largely defined by overcoming obstacles. After being diagnosed &\xa0\xa0overcoming a battle with a brain tumor, Chas unfortunately immediately was thrown another challenge, brought on by the trauma of brain surgery, he developed Fibromyalgia — a chronic neuro-mediated autoimmune inflammatory condition. Yet, he refuses to let illness define him. His journey through chronic pain and his resilience is reflected in the boldness, joy, vibrancy, and ultimately the constant evolution of his artwork as he has regained his health, stabilized, & manages his condition.', 'A passionate advocate for those battling chronic conditions, no patient should ever be left behind, Chas believes that with perseverance you can transform obstacles into opportunities, proving that no setback is greater than the passionate pursuit of one’s dreams. Keep believing, keep chasing, a better tomorrow is ahead!']:
              line=line.replace(' - ',' \u2014 ')
              t=html.escape(line,quote=False)
              t=t.replace('[[Chas Pulido]]','<a href="https://www.instagram.com/chaspulido" target="_blank" rel="noopener"%s>Chas Pulido</a>'%LINK)
              ps.append('<p>'+t+'</p>')
          ps.append('<p><span style="white-space:nowrap">Email: <a href="mailto:Chas@Pulido.Art"%s>Chas@Pulido.Art</a></span> &nbsp;\u00b7&nbsp; <span style="white-space:nowrap">Website: <a href="https://www.pulido.art" target="_blank" rel="noopener"%s>Pulido.Art</a></span> &nbsp;\u00b7&nbsp; <span style="white-space:nowrap">Instagram: <a href="https://www.instagram.com/chaspulido" target="_blank" rel="noopener"%s>@ChasPulido</a></span></p>'%(LINK,LINK,LINK))
          new=s[:img_end]+'\n'+'\n'.join(ps)+s[b:]
          open(p,'w',encoding='utf-8').write(new); print('ok',len(s),len(new))
          
          pathlib.Path('.github/workflows/apply-bio-once.yml').unlink()
          PY
          git config user.name 'n00stalgic'
          git config user.email 'n0000stalgic@gmail.com'
          git add index.html .github/workflows/apply-bio-once.yml
          git commit -m 'Update About bio to supplied Chas text'
          git push
